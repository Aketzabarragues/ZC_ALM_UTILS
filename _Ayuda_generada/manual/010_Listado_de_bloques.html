<!DOCTYPE html>

<body>

            <div class="doc-section">
<h2><a id="_Tablas_de_variables"></a><a id="_Toc224541409"></a><a id="_Toc224541404"></a>Listado de bloques</h2><p>El listado completo se encuentra en <span style="color: #EE0000;">PENDIENTE</span>.</p>
</div>

            <div style="height: 500px;"></div>
        </div>
    </div>

    <script>
        // Avisar al index cuando la página carga por primera vez
        document.addEventListener("DOMContentLoaded", function() {
            if(window.parent && typeof window.parent.marcarMenuDesdeIframe === "function") {
                window.parent.marcarMenuDesdeIframe(window.location.href);
            }
        });

        // Avisar al index cuando navegamos a un enlace interno en la misma página (#)
        window.addEventListener("hashchange", function() {
            if(window.parent && typeof window.parent.marcarMenuDesdeIframe === "function") {
                window.parent.marcarMenuDesdeIframe(window.location.href);
            }
        });
    </script>
</body>
